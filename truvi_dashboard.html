<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truvi Dashboard Revenue Analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #F7EFE5; color: #242424; font-size: 14px; line-height: 1.5; }
  .page { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid #FF40C1; margin-bottom: 24px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; background: #FF40C1; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo svg { width: 20px; height: 20px; }
  .wordmark { font-size: 18px; font-weight: 700; color: #242424; letter-spacing: -0.3px; }
  .wordmark span { color: #FF40C1; }
  .period-label { font-size: 12px; color: #6b7280; font-weight: 500; }

  /* TABS */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab { padding: 6px 16px; border-radius: 20px; border: 1.5px solid #BBC9DB; background: #fff; color: #242424; font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .tab:hover { border-color: #FF40C1; color: #FF40C1; }
  .tab.active { background: #242424; border-color: #242424; color: #fff; }

  /* METRICS STRIP */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .card { background: #fff; border-radius: 8px; padding: 14px 16px; border: 1px solid #e5e0d8; }
  .card.hi { background: #FFF0FA; border-color: #ffd6f0; }
  .card-label { font-size: 11px; color: #6b7280; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .card-value { font-size: 20px; font-weight: 700; color: #242424; }
  .card.hi .card-value { color: #FF40C1; }

  /* CHARTS ROW */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
  .chart-wrap { background: #fff; border-radius: 8px; padding: 18px; border: 1px solid #e5e0d8; }
  .chart-title { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 12px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #444; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chart-canvas-wrap { position: relative; height: 160px; }

  /* TABLES */
  .tables-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 16px; }
  .table-wrap { background: #fff; border-radius: 8px; border: 1px solid #e5e0d8; overflow: hidden; }
  .table-title { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; padding: 14px 16px 10px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #F7EFE5; font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; padding: 8px 12px; text-align: left; border-bottom: 1px solid #BBC9DB; }
  th:not(:first-child) { text-align: right; }
  td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #f0ebe3; color: #242424; }
  td:not(:first-child) { text-align: right; }
  tr:last-child td { border-bottom: none; }
  tr.tb td { font-weight: 700; background: #F7EFE5; border-top: 1px solid #BBC9DB; }

  /* NOTE CALLOUT */
  .note { background: #FFF0FA; border-left: 3px solid #FF40C1; border-radius: 0 6px 6px 0; padding: 12px 14px; margin-bottom: 24px; font-size: 12.5px; color: #444; line-height: 1.6; }
  .note strong { color: #242424; }
  .neg { color: #FF793A; font-weight: 600; }

  /* RECON LINE */
  .recon { font-size: 13px; font-weight: 700; color: #242424; padding: 12px 0; margin-bottom: 24px; border-top: 1px solid #e5e0d8; border-bottom: 1px solid #e5e0d8; }

  /* MOM SECTION */
  .mom-wrap { background: #fff; border-radius: 8px; border: 1px solid #e5e0d8; overflow: hidden; margin-bottom: 24px; }
  .mom-title { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; padding: 14px 16px 10px; border-bottom: 1px solid #f0ebe3; }
  .pos { color: #4B5EE4; font-weight: 600; }
  .neg-val { color: #FF793A; font-weight: 600; }
  .mom-note { font-size: 12.5px; color: #555; padding: 12px 16px; background: #fafaf8; border-top: 1px solid #f0ebe3; line-height: 1.6; }

  /* TRENDS */
  .trends { margin-bottom: 28px; }
  .trend-wrap { background: #fff; border-radius: 8px; padding: 18px; border: 1px solid #e5e0d8; margin-bottom: 16px; }
  .trend-title { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 14px; }
  .trend-canvas-wrap { position: relative; height: 200px; }

  /* FOOTER */
  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid #BBC9DB; font-size: 11px; color: #9ca3af; margin-top: 8px; }

  /* Section heading */
  .section-heading { font-size: 13px; font-weight: 700; color: #242424; margin-bottom: 14px; letter-spacing: -0.1px; }

  @media (max-width: 620px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .charts-row, .tables-row { grid-template-columns: 1fr; }
  }
</style>
</head>

function fmt(n) {
  if (n < 0) return '(£' + Math.abs(Math.round(n)).toLocaleString() + ')';
  return '£' + Math.round(n).toLocaleString();
}
function pct(n) { return n.toFixed(1) + '%'; }

// ── TABS ─────────────────────────────────────────────────────────────────────
function buildTabs() {
  const el = document.getElementById('tabs');
  MONTHS.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = m.label + ' · ' + m.fy;
    btn.onclick = () => setMonth(i);
    el.appendChild(btn);
  });
}

// ── SET MONTH ─────────────────────────────────────────────────────────────────
function setMonth(i) {
  activeIdx = i;
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', j === i));
  renderMonth(MONTHS[i], i);
}

        <thead><tr><th>Metric</th><th>Value</th></tr></thead>
        <tbody>
          <tr><td>RPB — total Dashboard</td><td>£${m.rpbTotal.toFixed(2)}</td></tr>
          <tr><td>RPB — protection (per protected booking)</td><td>£${m.rpbProt.toFixed(2)}</td></tr>
          <tr><td>RPB — screening (per total booking)</td><td>£${m.rpbScreen.toFixed(2)}</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;

  // Destroy old charts if they exist
  ['protChart-' + i, 'screenChart-' + i].forEach(id => {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
  });

  // Protection doughnut
  const pc = document.getElementById('protChart-' + i).getContext('2d');
  chartInstances['protChart-' + i] = new Chart(pc, {
    type: 'doughnut',
    data: { labels: tierLabels, datasets: [{ data: tierData, backgroundColor: tierColors, borderColor: '#F7EFE5', borderWidth: 3 }] },
    options: { cutout: '65%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': £' + ctx.parsed.toLocaleString() } } } }
  });
  const pl = document.getElementById('prot-legend-' + i);
  tierLabels.forEach((l, j) => { pl.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:${tierColors[j]}"></span>${l}</span>`; });

  // Screening doughnut
  const sc = document.getElementById('screenChart-' + i).getContext('2d');
  chartInstances['screenChart-' + i] = new Chart(sc, {
    type: 'doughnut',
    data: { labels: screenLabels, datasets: [{ data: screenData, backgroundColor: screenColors, borderColor: '#F7EFE5', borderWidth: 3 }] },
    options: { cutout: '65%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': £' + ctx.parsed.toLocaleString() } } } }
  });
  const sl = document.getElementById('screen-legend-' + i);
  screenLabels.forEach((l, j) => { sl.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:${screenColors[j]}"></span>${l}</span>`; });
}

// ── TRENDS ───────────────────────────────────────────────────────────────────
function buildTrends() {
  const labels = MONTHS.map(m => m.label);

  // 1. Stacked bar: Protection vs Screening
  const t1 = document.getElementById('trendStack').getContext('2d');
  new Chart(t1, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Protection', data: MONTHS.map(m => m.protRev), backgroundColor: '#FF40C1', stack: 'a' },
        { label: 'Screening', data: MONTHS.map(m => m.screenRev), backgroundColor: '#242424', stack: 'a' },
        { label: 'Legacy', data: MONTHS.map(m => m.legacyRev), backgroundColor: '#BBC9DB', stack: 'a' },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#f0ebe3' }, ticks: { callback: v => '£' + (v/1000).toFixed(0) + 'k' } } } }
  });

  // 2. Grouped bar: Protection by tier (all months)
  const allTierNames = ['0-500 Protection','0-50K Protection','0-1M Protection','500-50K Protection','500-1M Protection','500-5M Protection'];
  const tierDatasets = allTierNames.map((tn, j) => ({
    label: tn,
    data: MONTHS.map(m => { const t = m.tiers.find(x => x[0] === tn); return t ? t[1] : 0; }),
    backgroundColor: TIER_COLORS[j],
  }));
  const t2 = document.getElementById('trendTier').getContext('2d');
  new Chart(t2, {
    type: 'bar',
    data: { labels, datasets: tierDatasets },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#f0ebe3' }, ticks: { callback: v => '£' + (v/1000).toFixed(0) + 'k' } } } }
  });

  // 3. Line: RPB
  const t3 = document.getElementById('trendRPB').getContext('2d');
  new Chart(t3, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'RPB Total', data: MONTHS.map(m => m.rpbTotal), borderColor: '#FF40C1', backgroundColor: 'rgba(255,64,193,0.08)', borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: '#FF40C1', tension: 0.3, fill: false },
        { label: 'RPB Protection', data: MONTHS.map(m => m.rpbProt), borderColor: '#242424', borderDash: [5,3], borderWidth: 2, pointRadius: 4, pointBackgroundColor: '#242424', tension: 0.3, fill: false },
        { label: 'RPB Screening', data: MONTHS.map(m => m.rpbScreen), borderColor: '#4B5EE4', borderDash: [5,3], borderWidth: 2, pointRadius: 4, pointBackgroundColor: '#4B5EE4', tension: 0.3, fill: false },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#f0ebe3' }, ticks: { callback: v => '£' + v.toFixed(2) } } } }
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildTabs();
setMonth(0);
buildTrends();
</script>
</body>
</html>
